<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Claude Lane Coding — Codex requests Claude for design, review and verification">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e4de"/>
      <stop offset="0.5" stop-color="#e1ddd9"/>
      <stop offset="1" stop-color="#d8d2d3"/>
    </linearGradient>
    <radialGradient id="cl-chamber" cx="0.42" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#f3f1ec"/>
      <stop offset="0.7" stop-color="#e7e1e4"/>
      <stop offset="1" stop-color="#ddd5da"/>
    </radialGradient>
    <radialGradient id="cl-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cdbcd2"/>
      <stop offset="1" stop-color="#cdbcd2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cl-vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a3a40" stop-opacity="0.11"/>
    </radialGradient>
    <filter id="cl-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#3b3a40" flood-opacity="0.18"/>
    </filter>
    <filter id="cl-soft-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3b3a40" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#cl-bg)"/>

  <!-- faint floor -->
  <g stroke="#80807f" stroke-opacity="0.09" stroke-width="1">
    <line x1="160" y1="600" x2="1040" y2="600"/>
    <line x1="250" y1="535" x2="950" y2="535"/>
  </g>

  <!-- CODEX source node (left) -->
  <g filter="url(#cl-soft-sm)">
    <rect x="150" y="318" width="150" height="150" rx="16" fill="#edeae4" stroke="#2c2c32" stroke-opacity="0.14"/>
  </g>
  <g transform="translate(225 360)">
    <rect x="-34" y="-10" width="68" height="68" rx="8" fill="none" stroke="#8a8d86" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="-22" y="2" width="44" height="6" rx="3" fill="#9a9d94"/>
    <rect x="-22" y="16" width="30" height="6" rx="3" fill="#9a9d94" fill-opacity="0.6"/>
    <rect x="-22" y="30" width="38" height="6" rx="3" fill="#9a9d94" fill-opacity="0.8"/>
  </g>
  <text x="225" y="500" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="11" letter-spacing="3" fill="#7c8585">CODEX</text>

  <!-- request card in transit -->
  <g filter="url(#cl-soft-sm)" transform="rotate(-3 470 388)">
    <rect x="392" y="352" width="156" height="74" rx="10" fill="#efeae6" stroke="#2c2c32" stroke-opacity="0.13"/>
  </g>
  <text x="412" y="382" font-family="'DM Mono', ui-monospace, monospace" font-size="10.5" letter-spacing="1.5" fill="#3a3a40">CLAUDE_REQUEST</text>
  <g fill="#b9a9c0" fill-opacity="0.85">
    <rect x="412" y="394" width="58" height="5" rx="2.5"/>
    <rect x="412" y="406" width="100" height="5" rx="2.5" fill-opacity="0.5"/>
  </g>

  <!-- flow dots codex -> chamber -->
  <g fill="#a99bb0">
    <circle cx="318" cy="392" r="3" opacity="0.5"/>
    <circle cx="346" cy="391" r="3.4" opacity="0.7"/>
    <circle cx="374" cy="390" r="3.8" opacity="0.9"/>
    <circle cx="566" cy="390" r="3.8" opacity="0.9"/>
    <circle cx="596" cy="390" r="3.4" opacity="0.7"/>
    <circle cx="626" cy="390" r="3" opacity="0.5"/>
  </g>

  <!-- CLAUDE chamber (right) with signal rings -->
  <g transform="translate(820 390)">
    <circle r="210" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
    <circle r="160" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <circle r="112" fill="none" stroke="#ad9fb6" stroke-opacity="0.4" stroke-width="1"/>
    <g filter="url(#cl-soft)">
      <rect x="-78" y="-78" width="156" height="156" rx="20" fill="url(#cl-chamber)" stroke="#2c2c32" stroke-opacity="0.15"/>
    </g>
    <circle r="62" fill="url(#cl-core)"/>
    <circle r="13" fill="#b6a4bd"/>
    <circle r="13" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6"/>
  </g>
  <text x="820" y="624" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="11" letter-spacing="3" fill="#7c8585">CLAUDE</text>

  <!-- returned verdict tokens -->
  <g font-family="'DM Mono', ui-monospace, monospace" font-size="9" letter-spacing="1.5" fill="#4a4a50">
    <g filter="url(#cl-soft-sm)"><rect x="980" y="300" width="92" height="28" rx="14" fill="#efece6" stroke="#2c2c32" stroke-opacity="0.12"/></g>
    <text x="996" y="318">DESIGN</text>
    <g filter="url(#cl-soft-sm)"><rect x="1004" y="366" width="92" height="28" rx="14" fill="#efece6" stroke="#2c2c32" stroke-opacity="0.12"/></g>
    <text x="1020" y="384">REVIEW</text>
    <g filter="url(#cl-soft-sm)"><rect x="980" y="432" width="92" height="28" rx="14" fill="#efece6" stroke="#2c2c32" stroke-opacity="0.12"/></g>
    <text x="996" y="450">VERIFY</text>
  </g>

  <rect width="1200" height="780" fill="url(#cl-vig)"/>
</svg>
