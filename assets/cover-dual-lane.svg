<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dual Lane Coding — Claude and Codex working in parallel lanes">
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e5de"/>
      <stop offset="0.5" stop-color="#e2dfd8"/>
      <stop offset="1" stop-color="#d7d4cd"/>
    </linearGradient>
    <linearGradient id="dl-claude-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6ad9b"/>
      <stop offset="1" stop-color="#c39483"/>
    </linearGradient>
    <linearGradient id="dl-codex-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c666a"/>
      <stop offset="1" stop-color="#454e52"/>
    </linearGradient>
    <radialGradient id="dl-vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a4040" stop-opacity="0.10"/>
    </radialGradient>
    <filter id="dl-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#3c3530" flood-opacity="0.22"/>
    </filter>
    <filter id="dl-soft-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3c3530" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#dl-bg)"/>

  <!-- faint floor -->
  <g stroke="#7f8786" stroke-opacity="0.10" stroke-width="1">
    <line x1="150" y1="612" x2="1050" y2="612"/>
    <line x1="240" y1="548" x2="960" y2="548"/>
  </g>

  <!-- connector between lanes -->
  <g stroke="#9a9690" stroke-width="2" fill="none">
    <line x1="500" y1="375" x2="700" y2="375" stroke-opacity="0.5"/>
  </g>
  <g fill="#9a9690" fill-opacity="0.6">
    <path d="M508 368 L494 375 L508 382 Z"/>
    <path d="M692 368 L706 375 L692 382 Z"/>
  </g>
  <g filter="url(#dl-soft-sm)">
    <rect x="578" y="353" width="44" height="44" rx="9" transform="rotate(45 600 375)" fill="#f1eee8" stroke="#2a3030" stroke-opacity="0.14"/>
  </g>
  <text x="600" y="440" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="10.5" letter-spacing="3" fill="#7c8585">.AGENT-HANDOFF</text>

  <!-- CLAUDE tile -->
  <g transform="translate(390,335)">
    <g filter="url(#dl-soft)">
      <rect x="-110" y="-110" width="220" height="220" rx="24" fill="url(#dl-claude-bg)"/>
    </g>
    <g fill="#f6efe9">
      <rect x="-7" y="-78" width="14" height="64" rx="7"/>
      <rect x="-7" y="14" width="14" height="64" rx="7"/>
      <rect x="-78" y="-7" width="64" height="14" rx="7"/>
      <rect x="14" y="-7" width="64" height="14" rx="7"/>
      <g opacity="0.92">
        <rect x="-5" y="-58" width="10" height="44" rx="5" transform="rotate(45 0 0)"/>
        <rect x="-5" y="-58" width="10" height="44" rx="5" transform="rotate(135 0 0)"/>
        <rect x="-5" y="-58" width="10" height="44" rx="5" transform="rotate(225 0 0)"/>
        <rect x="-5" y="-58" width="10" height="44" rx="5" transform="rotate(315 0 0)"/>
      </g>
      <circle r="9" fill="#f6efe9"/>
    </g>
  </g>
  <text x="390" y="494" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="15" letter-spacing="4" fill="#3a3430">CLAUDE</text>
  <text x="390" y="518" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="9.5" letter-spacing="2.5" fill="#8a7e78">LANE_A · DESIGN / REVIEW / MERGE</text>

  <!-- CODEX tile -->
  <g transform="translate(810,335)">
    <g filter="url(#dl-soft)">
      <rect x="-110" y="-110" width="220" height="220" rx="24" fill="url(#dl-codex-bg)"/>
    </g>
    <g stroke="#e7e5df" stroke-width="2.4" fill="none" stroke-opacity="0.85">
      <path d="M0 -56 L48.5 -28 L48.5 28 L0 56 L-48.5 28 L-48.5 -28 Z"/>
      <line x1="0" y1="0" x2="0" y2="-56"/>
      <line x1="0" y1="0" x2="48.5" y2="-28"/>
      <line x1="0" y1="0" x2="48.5" y2="28"/>
      <line x1="0" y1="0" x2="0" y2="56"/>
      <line x1="0" y1="0" x2="-48.5" y2="28"/>
      <line x1="0" y1="0" x2="-48.5" y2="-28"/>
    </g>
    <g fill="#e7e5df">
      <circle cx="0" cy="-56" r="6.5"/>
      <circle cx="48.5" cy="-28" r="6.5"/>
      <circle cx="48.5" cy="28" r="6.5"/>
      <circle cx="0" cy="56" r="6.5"/>
      <circle cx="-48.5" cy="28" r="6.5"/>
      <circle cx="-48.5" cy="-28" r="6.5"/>
      <circle cx="0" cy="0" r="9"/>
    </g>
  </g>
  <text x="810" y="494" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="15" letter-spacing="4" fill="#3a3430">CODEX</text>
  <text x="810" y="518" text-anchor="middle" font-family="'DM Mono', ui-monospace, monospace" font-size="9.5" letter-spacing="2.5" fill="#8a7e78">LANE_B · IMPLEMENT / DIFF / TEST</text>

  <!-- skill tag -->
  <g filter="url(#dl-soft-sm)">
    <rect x="478" y="180" width="244" height="42" rx="21" fill="#f1eee8" stroke="#2a3030" stroke-opacity="0.14"/>
  </g>
  <circle cx="506" cy="201" r="4.5" fill="#9aa9a3"/>
  <text x="522" y="206" font-family="'DM Mono', ui-monospace, monospace" font-size="13" letter-spacing="3.5" fill="#3a3430">SKILL · DUAL-LANE</text>

  <rect width="1200" height="780" fill="url(#dl-vig)"/>
</svg>
